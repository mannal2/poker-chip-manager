name: CI and images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check deployment script
        run: |
          bash -n deploy/deploy-frontend.sh
          bash deploy/test-deploy-frontend.sh

      - name: Check release planning
        run: |
          bash -n deploy/plan-release.sh
          bash -n deploy/check-revision.sh
          bash -n deploy/release-remote.sh
          bash deploy/test-plan-release.sh

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Unit tests
        run: npm --prefix frontend test -- --run

      - name: Install test browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Browser tests
        working-directory: frontend
        # --no-deps: the serial projects depend on the full parallel projects, which would
        # otherwise run every spec. One worker keeps the two browsers' pwa.spec runs apart.
        run: |
          npx playwright test --no-deps --workers=1 \
            e2e/app-flow.spec.ts \
            e2e/game.spec.ts \
            e2e/pwa.spec.ts

      - name: Build production Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f frontend/Dockerfile \
            -t poker-frontend:ci .

      - name: Check asset copying in production image
        run: |
          docker run --rm --network none --entrypoint sh \
            --mount "type=bind,src=$PWD/deploy,dst=/deployment,readonly" \
            poker-frontend:ci /deployment/test-copy-frontend-assets.sh

      - name: Check container response
        run: |
          docker run -d \
            --name poker-ci \
            -p 127.0.0.1:4180:80 \
            poker-frontend:ci

          curl --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-connrefused \
            --retry-delay 1 \
            --max-time 10 \
            http://127.0.0.1:4180/local/ \
            -o /dev/null

      - name: Container logs on failure
        if: failure()
        run: docker logs poker-ci || true

  backend:
    uses: ./.github/workflows/backend-ci.yml

  online-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      # Compiling first keeps bootRun inside Playwright's server start limit.
      - name: Compile backend
        working-directory: backend
        run: ./gradlew :server:classes

      - name: Online browser tests
        working-directory: frontend
        # Pull requests skip the 60-second test and the serial deploy-gate project.
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            npx playwright install --with-deps chromium
            npx playwright test --config playwright.online.config.ts \
              --project=chromium --grep-invert @slow
          else
            npx playwright install --with-deps chromium webkit
            npx playwright test --config playwright.online.config.ts
          fi

  plan:
    needs: [checks, backend, online-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      backend: ${{ steps.compare.outputs.backend }}
      frontend: ${{ steps.compare.outputs.frontend }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout history
        if: vars.BACKEND_DEPLOY_ENABLED == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # An unreachable server must not stop publishing; the deploy job reports it.
      - name: Connect to Tailscale
        if: vars.BACKEND_DEPLOY_ENABLED == 'true'
        continue-on-error: true
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Compare with deployed revisions
        id: compare
        env:
          BACKEND_ENABLED: ${{ vars.BACKEND_DEPLOY_ENABLED }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail

          if [[ "$BACKEND_ENABLED" != true ]]; then
            printf 'frontend=true\nbackend=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          revisions=$(bash deploy/release-remote.sh read-revisions)
          frontend_current=$(sed -n 's/^frontend_current=//p' <<< "$revisions")
          backend_current=$(sed -n 's/^backend_current=//p' <<< "$revisions")
          bash deploy/check-revision.sh changed "$frontend_current" "$backend_current" "$GITHUB_SHA" \
            >> "$GITHUB_OUTPUT"

      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/poker-ssh/id_ed25519"

  publish:
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image: ${{ steps.publish.outputs.image }}

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/mannal2/poker-chip-manager-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin

      - name: Build and publish
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --platform linux/amd64 \
            -f frontend/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/mannal2/poker-chip-manager" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:sha-$GITHUB_SHA" .

          docker push "$IMAGE:sha-$GITHUB_SHA"

          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          [[ "$digest" == "$IMAGE"@sha256:* && "${digest##*@sha256:}" =~ ^[a-f0-9]{64}$ ]]
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"

          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:main"
            docker push "$IMAGE:main"
          else
            echo 'A newer main commit exists; leaving the main image tag unchanged.'
          fi

  publish-backend:
    needs: plan
    if: vars.BACKEND_DEPLOY_ENABLED == 'true' && needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image: ${{ steps.publish.outputs.image }}

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/mannal2/poker-chip-manager-backend

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin

      - name: Build and publish
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --platform linux/amd64 \
            -f backend/Dockerfile \
            --build-arg "REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/mannal2/poker-chip-manager" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:sha-$GITHUB_SHA" backend

          docker push "$IMAGE:sha-$GITHUB_SHA"

          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          [[ "$digest" == "$IMAGE"@sha256:* && "${digest##*@sha256:}" =~ ^[a-f0-9]{64}$ ]]
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"

          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:main"
            docker push "$IMAGE:main"
          else
            echo 'A newer main commit exists; leaving the main image tag unchanged.'
          fi

  deploy:
    needs: [plan, publish, publish-backend]
    # A skipped publish is normal here; a failed one stops both services.
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      && (needs.publish-backend.result == 'success' || needs.publish-backend.result == 'skipped')
      && (needs.plan.outputs.frontend == 'true' || needs.plan.outputs.backend == 'true')

    permissions:
      contents: read
      id-token: write
      packages: read

    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
      backend_changed: ${{ needs.plan.outputs.backend }}
      frontend_changed: ${{ needs.plan.outputs.frontend }}
      backend_image: ${{ needs.publish-backend.outputs.image }}
      frontend_image: ${{ needs.publish.outputs.image }}
      require_latest: true
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
