poker:
  max-rooms: 10
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

spring:
  threads:
    virtual:
      enabled: true

server:
  servlet:
    session:
      timeout: 7d
      tracking-modes: cookie
      cookie:
        name: PCM_SESSION
        http-only: true
        same-site: lax
        max-age: 7d

---
spring:
  config:
    activate:
      on-profile: prod

poker:
  allowed-origins:
    - https://pcm.jwlee.xyz

server:
  servlet:
    session:
      cookie:
        name: __Host-pcm-session
        secure: true

---
spring:
  config:
    activate:
      on-profile: e2e

poker:
  max-rooms: 200
  allowed-origins:
    - http://127.0.0.1:4174
