<body><main class="layout"><aside class="intro"><div class="eyebrow">POKER CHIP MANAGER / DESIGN 04</div><h1>같은 테이블.<span>한눈에, 모든 칩.</span></h1><p>앉아 있는 순서 그대로 살펴보고,<br>이번에 낼 금액만 입력하세요.</p><details class="controls"><summary>시안 설정 · 2 / 6 / 9인</summary><div class="review-body"><span class="label">테이블 인원</span><div class="row" id="counts"><button data-count="2">2명</button><button data-count="6" aria-pressed="true">6명</button><button data-count="9">9명</button></div><span class="label">검토할 화면</span><div class="stage-nav" id="stages"><button data-stage="setup">준비</button><button data-stage="game" aria-pressed="true">베팅</button><button data-stage="reveal">카드 공개</button><button data-stage="settle">정산</button></div><button id="stress" class="quiet" aria-pressed="false">긴 이름·큰 금액 보기</button><p class="note">단일 기기 · 조작 가능한 화면 시안<br>예시 데이터로 동작하며 실제 게임 규칙·저장·통신은 포함하지 않습니다. 인원이나 화면을 바꾸면 예시가 초기화됩니다.</p></div></details></aside><section class="phone" aria-label="모바일 화면 시안"><div class="meta"><div class="meta-info"><span id="hand"></span><span id="blinds"></span></div><button id="menu" aria-label="관리 메뉴" aria-haspopup="dialog">☰</button></div><div id="table" class="table"></div><section id="dock" class="dock"></section></section></main><div id="toast" role="status" aria-live="polite"></div><dialog id="historyDialog"><h2>이번 핸드 기록</h2><ol id="logs"></ol><button class="primary" id="closeHistory">닫기</button></dialog>
<dialog id="menuDialog"><h2>관리 메뉴</h2><div class="menu-actions"><button id="history">기록</button><button id="blindSettings">다음 핸드 블라인드</button><button id="advanceStreet">다음 라운드 · 시안 체험</button><button id="openReveal">카드 공개 화면 · 시안 체험</button><button id="stopGame">토너먼트 중단</button><button id="closeMenu">닫기</button></div></dialog><dialog id="adminDialog"><div id="adminBody"></div><button id="closeAdmin">닫기</button></dialog><script>
'use strict';
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('ko-KR');
const names=['지우','민준','서연','도윤','하린','유진','지호','수빈','준서'];
let street='PREFLOP',contributions=[],nextBlinds=null;
let count=9,stage='game',stress=false,amount=10,revealed=false,winners=new Set(),timer,lastAction=null;
let initial=1000,sbValue=5,bbValue=10,dealer=8,sb=0,bb=1,actor=2,hand=1,balances=[],bets=[],logs=[];
function notify(text){$('#toast').textContent=text;clearTimeout(timer);timer=setTimeout(()=>$('#toast').textContent='',2200)}
function live(){return balances.map((v,i)=>v+bets[i]>0?i:-1).filter(i=>i>=0)}
function nextSeat(from,eligible){for(let n=1;n<=count;n++){const i=(from+n)%count;if(eligible.includes(i))return i}return from}
function roles(){const eligible=live();sb=eligible.length===2?dealer:nextSeat(dealer,eligible);bb=nextSeat(sb,eligible);actor=eligible.length===2?dealer:nextSeat(bb,eligible)}
function reset(next=stage){stage=next;dealer=count-1;hand=1;balances=Array(count).fill(stress?1000000:initial);bets=Array(count).fill(0);roles();revealed=false;winners.clear();logs=[];lastAction=null;street='PREFLOP';nextBlinds=null;if(stage!=='setup'){bets=Array(count).fill(bbValue);balances=balances.map(v=>v-bbValue);balances[actor]+=bets[actor];bets[actor]=0}contributions=[...bets];amount=0;render()}
function pot(){return contributions.reduce((a,b)=>a+b,0)}
function playerName(i){return stress&&i===1?'가나다라마바사아자차':names[i]}
function positions(){if(count===2)return [[50,84],[50,16]];if(count===9)return [[50,90],[19,79],[14,58],[14,36],[28,14],[72,14],[86,36],[86,58],[81,79]];return [[50,87],[16,68],[16,31],[50,13],[84,31],[84,68]]}
function payouts(){const ids=[...winners].sort((a,b)=>((a-dealer-1+count)%count)-((b-dealer-1+count)%count));if(!ids.length)return [];const unit=Math.floor(pot()/5/ids.length),extra=pot()/5-unit*ids.length;return ids.map((id,k)=>({id,value:(unit+(k<extra?1:0))*5}))}
function renderTable(){const setup=stage==='setup';$('#table').innerHTML='<div class="felt"></div><div class="pot"><small>'+(setup?'TABLE':stage==='settle'?'MAIN POT':'POT')+'</small><strong>'+(setup?count+'명':fmt(pot()))+'</strong><span>'+(stage==='game'?street:stage==='settle'?'승자 선택':stage==='reveal'?'SHOWDOWN':'')+'</span></div>'+positions().map(([x,y],i)=>{const active=stage==='game'&&i===actor;const badges=[i===dealer?'D':'',i===sb?'SB':'',i===bb?'BB':''].filter(Boolean).join(' · ');return '<button type="button" data-seat="'+i+'" class="seat '+(active?'active ':'')+(winners.has(i)?'selected':'')+'" style="left:'+x+'%;top:'+y+'%" aria-label="'+playerName(i)+(active?' 현재 차례':'')+'" '+(stage==='settle'?'aria-pressed="'+winners.has(i)+'"':'')+'>'+ (badges?'<span class="badge">'+badges+'</span>':'')+'<div class="name">'+playerName(i)+'</div><div class="card-values"><div class="bet" aria-label="핸드 누적액 '+fmt(contributions[i])+'">'+fmt(contributions[i])+'</div><div class="stack" aria-label="남은 칩 '+fmt(balances[i])+'">'+fmt(balances[i])+'</div></div>'+(active?'<span class="turn"></span>':'')+'</button>'}).join('');if(stage==='settle')document.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{const i=+b.dataset.seat;winners.has(i)?winners.delete(i):winners.add(i);render()})}
function render(){document.querySelectorAll('[data-count]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.count===count));document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.stage===stage));$('#stress').setAttribute('aria-pressed',stress);$('#hand').innerHTML='HAND <strong>'+String(hand).padStart(2,'0')+'</strong>';$('#blinds').innerHTML='<strong>'+fmt(sbValue)+' / '+fmt(bbValue)+'</strong>';renderTable();document.querySelectorAll('.card-values>div').forEach(cell=>{let size=11;cell.style.fontSize=size+'px';while(cell.scrollWidth>cell.clientWidth&&size>7){size-=.25;cell.style.fontSize=size+'px'}});const d=$('#dock');
if(stage==='setup'){d.innerHTML='<div class="setup-fields"><label><span>시작 칩</span><input id="initial" type="number" inputmode="numeric" step="5" value="'+initial+'"></label><label><span>SB</span><input id="sb" type="number" inputmode="numeric" step="5" value="'+sbValue+'"></label><label><span>BB</span><input id="bb" type="number" inputmode="numeric" step="5" value="'+bbValue+'"></label></div><button class="primary" style="width:100%" id="start">게임 시작</button>';$('#start').onclick=()=>{const values=[$('#initial'),$('#sb'),$('#bb')].map(e=>Number(e.value));if(values.some(v=>!Number.isInteger(v)||v<=0||v%5||v>1000000)||values[1]>=values[2]||values[0]<values[2])return notify('5 단위, SB < BB ≤ 시작 칩으로 설정하세요.');[initial,sbValue,bbValue]=values;balances=Array(count).fill(initial);bets=Array(count).fill(0);roles();postBlinds();stage='game';amount=0;render()};enableDrag()}
if(stage==='game'){renderBet(d)}
if(stage==='reveal'){d.innerHTML='<div class="actions"><button id="undo">베팅 취소</button><button id="reveal" class="primary">카드 공개</button></div>';$('#undo').onclick=undoAction;$('#reveal').onclick=()=>{revealed=true;lastAction=null;logs.push('카드 공개 · 취소 잠금');stage='settle';winners.clear();render()}}
if(stage==='settle'){const rewards=payouts();d.innerHTML='<div class="settlement-count" aria-live="polite">'+winners.size+'명 선택</div><button id="settle" class="primary" style="width:100%">WIN</button>';document.querySelectorAll('[data-seat]').forEach(card=>{const reward=rewards.find(p=>p.id===+card.dataset.seat);if(reward)card.setAttribute('aria-description','예상 수령 '+fmt(reward.value))});$('#settle').onclick=()=>{if(!winners.size)return notify('테이블에서 승자를 선택하세요.');const reward=payouts();reward.forEach(p=>balances[p.id]+=p.value);logs.push('HAND '+hand+' 정산: '+reward.map(p=>playerName(p.id)+' +'+fmt(p.value)).join(', '));bets.fill(0);contributions.fill(0);const eligible=live();if(eligible.length===1){stage='ended';winners.clear();render();return}dealer=nextSeat(dealer,eligible);hand++;lastAction=null;street='PREFLOP';if(nextBlinds){[sbValue,bbValue]=nextBlinds;nextBlinds=null}roles();postBlinds();stage='game';winners.clear();revealed=false;amount=0;render()}}
if(stage==='ended'){d.innerHTML='<div class="summary"><strong>토너먼트 종료</strong></div><button id="restart" class="primary" style="width:100%">새 게임</button>';$('#restart').onclick=()=>reset('setup')}
}
function renderBet(d){
const call=Math.min(balances[actor],Math.max(...bets)-bets[actor]);
d.innerHTML='<div class="bet-top"><button id="undo" aria-disabled="'+(!lastAction||revealed)+'">베팅 취소</button><button id="check">'+(call?'콜 '+fmt(call):'체크')+'</button><button id="fold">폴드</button><button id="allin">올인</button></div><div class="bet-bottom"><button id="clear" aria-label="미확정 입력 초기화">C</button>'+[5,10,50,100].map(n=>'<button class="chip" data-chip="'+n+'" aria-label="'+n+'칩 추가"><span>'+n+'</span></button>').join('')+'<button id="bet" class="primary">BET</button></div>';
document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{const added=+b.dataset.chip;if(amount+added>balances[actor])return notify('남은 칩을 초과할 수 없습니다.');amount+=added;updateAmount()});$('#clear').onclick=()=>{amount=0;updateAmount()};$('#allin').onclick=()=>{amount=balances[actor];updateAmount()};$('#undo').onclick=undoAction;$('#check').onclick=()=>applyBet(call);$('#bet').onclick=()=>{if(!Number.isSafeInteger(amount)||amount<call||amount<=0||amount%5||amount>balances[actor])return notify('콜 금액 이상으로 칩을 선택하세요.');applyBet(amount)};$('#fold').onclick=()=>notify('폴드는 배치 확인용입니다. 전체 규칙 처리는 시안 범위 밖입니다.');updateAmount();
}
function postBlinds(){bets.fill(0);contributions=Array(count).fill(0);for(const [i,value] of [[sb,sbValue],[bb,bbValue]]){const paid=Math.min(balances[i],value);balances[i]-=paid;bets[i]=paid;contributions[i]=paid}logs.push('HAND '+hand+' · '+playerName(sb)+' SB '+bets[sb]+' / '+playerName(bb)+' BB '+bets[bb])}
function undoAction(){if(revealed||!lastAction)return notify(revealed?'카드 공개 후에는 취소할 수 없습니다.':'취소할 이전 베팅이 없습니다.');if(lastAction){balances=lastAction.balances;bets=lastAction.bets;contributions=lastAction.contributions;amount=0;logs.push("마지막 행동 취소");actor=lastAction.actor;lastAction=null}stage="game";render()}
function applyBet(value){lastAction={balances:[...balances],bets:[...bets],contributions:[...contributions],actor};balances[actor]-=value;bets[actor]+=value;contributions[actor]+=value;logs.push(playerName(actor)+' 추가 '+value+' (시안)');actor=nextSeat(actor,live());amount=0;render()}
function updateAmount(){const cell=$('[data-seat="'+actor+'"] .bet');if(!cell)return;cell.textContent=fmt(contributions[actor]+amount);cell.classList.toggle('pending',amount>0);cell.setAttribute('aria-label','핸드 누적액 '+fmt(contributions[actor]+amount)+(amount?' 미확정 '+fmt(amount)+' 포함':''));let size=11;cell.style.fontSize=size+'px';while(cell.scrollWidth>cell.clientWidth&&size>7){size-=.25;cell.style.fontSize=size+'px'}}
function enableDrag(){const cards=[...document.querySelectorAll('.seat')],coords=positions();cards.forEach((card,index)=>{card.style.touchAction='none';let hold,dragging=false,startX,startY,target=index,order=[];function restore(){clearTimeout(hold);if(dragging){dragging=false;render()}}card.onpointerdown=e=>{startX=e.clientX;startY=e.clientY;card.setPointerCapture(e.pointerId);hold=setTimeout(()=>{dragging=true;order=cards.map((_,i)=>i);card.classList.add('dragging')},350)};card.onpointermove=e=>{if(!dragging){if(Math.hypot(e.clientX-startX,e.clientY-startY)>10)clearTimeout(hold);return}const rect=$('#table').getBoundingClientRect();const x=e.clientX-rect.left,y=e.clientY-rect.top;card.style.left=x+'px';card.style.top=y+'px';let closest=target,distance=Infinity;coords.forEach(([px,py],i)=>{const d=Math.hypot(x-px/100*rect.width,y-py/100*rect.height);if(d<distance){distance=d;closest=i}});target=closest;order=cards.map((_,i)=>i).filter(i=>i!==index);order.splice(target,0,index);order.forEach((original,slot)=>{if(original===index)return;cards[original].style.left=coords[slot][0]+'%';cards[original].style.top=coords[slot][1]+'%'})};card.onpointerup=e=>{clearTimeout(hold);if(!dragging)return;const rect=$('#table').getBoundingClientRect();if(e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom){const previous=names.slice(0,count);order.forEach((old,i)=>names[i]=previous[old])}dragging=false;render()};card.onpointercancel=restore;card.onlostpointercapture=restore})}
function closeReview(){if(innerWidth<=780)$('.controls').open=false}
 document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{count=+b.dataset.count;reset();closeReview()});document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{reset(b.dataset.stage);closeReview()});$('#stress').onclick=()=>{stress=!stress;reset();closeReview()};$('#history').onclick=()=>{$('#menuDialog').close();$('#logs').replaceChildren(...logs.map(text=>{const li=document.createElement('li');li.textContent=text;return li}));$('#historyDialog').showModal()};$('#closeHistory').onclick=()=>$('#historyDialog').close();$('#menu').onclick=()=>$('#menuDialog').showModal();$('#closeMenu').onclick=()=>$('#menuDialog').close();$('#closeAdmin').onclick=()=>$('#adminDialog').close();
$('#blindSettings').onclick=()=>{$('#menuDialog').close();const pair=nextBlinds||[sbValue,bbValue];$('#adminBody').innerHTML='<h2>다음 핸드 블라인드</h2><div class="admin-fields"><label>SB<input id="nextSB" type="number" value="'+pair[0]+'"></label><label>BB<input id="nextBB" type="number" value="'+pair[1]+'"></label></div><button id="saveBlinds" class="primary">예약</button>';$('#saveBlinds').onclick=()=>{const a=Number($('#nextSB').value),b=Number($('#nextBB').value);if(!Number.isInteger(a)||!Number.isInteger(b)||a<=0||a>=b||a%5||b%5||b>1000000)return notify('5 단위, 0 < SB < BB로 입력하세요.');nextBlinds=[a,b];$('#adminDialog').close();notify('다음 핸드부터 '+a+' / '+b+' 적용')};$('#adminDialog').showModal()};
$('#stopGame').onclick=()=>{$('#menuDialog').close();$('#adminBody').innerHTML='<h2>토너먼트 중단</h2><p>현재 칩과 미정산 팟을 남기고 진행을 중단합니다.</p><button id="confirmStop" class="primary">중단 확정</button>';$('#confirmStop').onclick=()=>{logs.push('토너먼트 중단');stage='stopped';amount=0;lastAction=null;$('#adminDialog').close();render();$('#dock').innerHTML='<div class="summary">토너먼트 중단</div>'};$('#adminDialog').showModal()};
$('#advanceStreet').onclick=()=>{if(stage!=='game')return notify('베팅 화면에서 체험할 수 있습니다.');const streets=['PREFLOP','FLOP','TURN','RIVER'];const i=streets.indexOf(street);if(i===3)return notify('리버 다음은 카드 공개 화면에서 진행하세요.');street=streets[i+1];bets.fill(0);amount=0;lastAction=null;logs.push(street+' · 라운드 전환 시안');$('#menuDialog').close();render()};
$('#openReveal').onclick=()=>{if(stage!=='game')return notify('베팅 화면에서 이동하세요.');amount=0;stage='reveal';$('#menuDialog').close();render()};
if(innerWidth>780)$('.controls').open=true;reset();
</script></body></html>
