name: Backend CI

# CI and images calls this for every pull request and main push, so main can wait
# for it before publishing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test backend
        working-directory: backend
        run: ./gradlew test

      - name: Check deployment scripts
        run: |
          bash -n deploy/deploy-backend.sh
          bash -n deploy/recover-backend.sh
          bash -n deploy/backend-lib.sh
          bash deploy/test-deploy-backend.sh

      - name: Build production Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f backend/Dockerfile \
            --build-arg "REVISION=$GITHUB_SHA" \
            -t poker-backend:ci backend
