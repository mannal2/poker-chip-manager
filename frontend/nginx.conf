server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML은 새 파일 목록을 확인하고 해시가 붙은 자산은 기존 캐시를 사용한다.
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /local/sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
