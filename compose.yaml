name: poker

services:
  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}"
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - frontend-assets:/usr/share/nginx/html/assets:ro
    networks:
      poker-edge:
        aliases:
          - poker-frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  poker-edge:
    external: true

volumes:
  frontend-assets:
    name: poker-frontend-assets
    external: true